name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global typescript@5
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet -composites=false ./...
      - run: go test -race -short ./...
      - run: tsc --noEmit
  bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run 'TestBotsPlayLegalGames|TestBotStrength' ./internal/bot
